name: slr
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - ffmpeg           # system dep for video download/trim
  - pip:
      - numpy>=1.24
      - scipy>=1.10
      - pandas>=2.0
      - pyyaml>=6.0
      - tqdm>=4.65
      - scikit-learn>=1.3
      - matplotlib>=3.7
      - yt-dlp>=2024.1.0
      - requests>=2.31
      - opencv-python>=4.8
      # Install torch/torchvision matching your CUDA separately, e.g.:
      #   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121
      - torch>=2.1
      - torchvision>=0.16
