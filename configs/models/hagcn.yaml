# HA-GCN (hierarchical spatial+temporal attention GCN) — official repo via adapter.
# Place the implementation at third_party/HA-GCN and set the import path below.
model:
  name: hagcn
  modality: skeleton
  in_channels: 3
  third_party: third_party/HA-GCN
  import: model.hagcn.Model          # adjust to the repo's actual class path
  args:
    num_point: 27
    num_person: 1
    graph: graph.sign27.Graph
    in_channels: 3

train:
  epochs: 80
  optimizer: { name: sgd, lr: 0.1, momentum: 0.9, weight_decay: 0.0005, nesterov: true }
  scheduler: { name: cosine, warmup_epochs: 5 }
